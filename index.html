<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>CUT CODE｜ウキウキ倶楽部 デジタルカットマニュアル</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.jpg">
<style>
:root{--bg:#f5f5f6;--card:#fff;--ink:#222;--sub:#7a7d82;--line:#e4e5e7;--accent:#e60012;--r:14px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar img{height:34px;cursor:pointer}
.bar .t{font-size:13px;color:var(--sub);letter-spacing:.2em;font-weight:600}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:20px;margin:6px 0 14px}
h2{font-size:15px;margin:22px 0 8px}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);font-size:16px;background:#fff;margin-bottom:16px}
.crumb{font-size:12px;color:var(--sub);margin-bottom:6px}
.crumb a{color:var(--sub);cursor:pointer;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.two{grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;min-height:104px;padding:10px 8px;font-size:13px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.card:active{background:#fafafa}
.card.center{background:var(--accent);border-color:var(--accent);color:#fff;cursor:default}
.card.empty{background:transparent;border:1px dashed var(--line);cursor:default}
.card.big{min-height:130px;font-size:17px}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.row b{font-size:15px;display:block}.row small{color:var(--sub);font-size:12px}
.back{background:none;border:0;color:var(--sub);font-size:14px;padding:4px 0;cursor:pointer}
.video{position:relative;aspect-ratio:9/16;max-width:380px;margin:0 auto;background:#2a2b2e;border-radius:var(--r);overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px}
ol{padding-left:22px}ol li{margin-bottom:8px}
ul.pt{list-style:none;padding:0}
ul.pt li{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:14px}
.nav{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-size:14px;text-align:center;cursor:pointer}
.btn.dark{background:#222;color:#fff;border-color:#222}
.msg{color:var(--sub);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header><div class="bar"><img src="logo.jpg" alt="U2C ウキウキ倶楽部" onclick="location.hash=''"><span class="t">CUT CODE</span></div></header>
<main id="app"></main>

<script src="lessons.js"></script>
<script>
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- データの準備: id自動付与 → 参照(R)の解決 ----
const REG = {};
(function assign(n, parentId){
  (n.children || []).forEach((c, i) => {
    if (c.ref) return;
    if (!c.id) c.id = parentId + '-' + (i + 1);
    REG[c.id] = c;
    assign(c, c.id);
  });
})(ROOT, 'root');
(function resolve(n){
  if (!n.children) return;
  n.children = n.children.map(c => c.ref ? REG[c.ref] : c);
  n.children.forEach(c => { if (!c._done) { c._done = true; resolve(c); } });
})(ROOT);

const isLeaf = n => !n.children;
const driveEmbed = url => { const m = url && (url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/)); return m ? `https://drive.google.com/file/d/${m[1]}/preview` : ''; };

// hash は #/cb/base/base-bob のように id を並べる
function walk(segs){
  const nodes = [ROOT];
  for (const s of segs) {
    const c = (nodes[nodes.length-1].children || []).find(x => x.id === s);
    if (!c) return null;
    nodes.push(c);
  }
  return nodes;
}
const hashOf = nodes => '#/' + nodes.slice(1).map(n => n.id).join('/');
const go = h => { location.hash = h; };

function crumbHtml(nodes){
  return `<div class="crumb">` + nodes.slice(0,-1).map((n,i) =>
    `<a onclick="go('${hashOf(nodes.slice(0,i+1))}')">${esc(n.name)}</a>`).join(' › ') + `</div>`;
}

function tiles(nodes){
  const node = nodes[nodes.length-1], kids = node.children;
  const tile = c => `<div class="card" onclick="go('${hashOf([...nodes, c])}')">${esc(c.name)}</div>`;
  if (kids.length >= 7) {                       // 曼荼羅(中央に自分の名前)
    const cells = Array(9).fill(null), slots = [0,1,2,3,5,6,7,8];
    kids.forEach((c,i) => cells[slots[i]] = c);
    return '<div class="grid">' + cells.map((c,i) =>
      i === 4 ? `<div class="card center">${esc(node.name)}</div>` :
      c ? tile(c) : '<div class="card empty"></div>').join('') + '</div>';
  }
  return kids.map(c => `<div class="row" onclick="go('${hashOf([...nodes, c])}')"><b>${esc(c.name)}</b>${c.children?`<small>${c.children.length}項目</small>`:''}</div>`).join('');
}

function home(q = ''){
  $app.innerHTML = `<input type="search" id="q" placeholder="キーワードで検索" value="${esc(q)}"><div id="res"></div>`;
  const res = document.getElementById('res');
  if (q) {
    const hits = [], seen = new Set();
    (function dfs(nodes){
      const n = nodes[nodes.length-1];
      if (seen.has(n)) return; seen.add(n);
      if (nodes.length > 1 && n.name.includes(q)) hits.push(nodes);
      (n.children || []).forEach(c => dfs([...nodes, c]));
    })([ROOT]);
    res.innerHTML = hits.length ? hits.map(h => `<div class="row" onclick="go('${hashOf(h)}')"><b>${esc(h[h.length-1].name)}</b><small>${esc(h.slice(1,-1).map(n=>n.name).join(' › '))}</small></div>`).join('') : '<p class="msg">見つかりませんでした</p>';
  } else {
    res.innerHTML = '<div class="grid two">' + ROOT.children.map(c =>
      `<div class="card big" onclick="go('${hashOf([ROOT, c])}')">${esc(c.name)}</div>`).join('') + '</div>';
  }
  const i = document.getElementById('q');
  i.addEventListener('input', e => { home(e.target.value.trim()); const j = document.getElementById('q'); j.focus(); j.setSelectionRange(j.value.length, j.value.length); });
}

function nodeView(nodes){
  const node = nodes[nodes.length-1], parent = nodes[nodes.length-2];
  if (!isLeaf(node)) {
    $app.innerHTML = crumbHtml(nodes) + `<button class="back" onclick="go('${hashOf(nodes.slice(0,-1))}')">‹ 戻る</button><h1>${esc(node.name)}</h1>` + tiles(nodes);
    return;
  }
  const sibs = parent.children.filter(isLeaf), i = sibs.indexOf(node), embed = driveEmbed(node.video);
  const steps = node.steps || [], points = node.points || [];
  $app.innerHTML = crumbHtml(nodes) + `<button class="back" onclick="go('${hashOf(nodes.slice(0,-1))}')">‹ 戻る</button><h1>${esc(node.name)}</h1>
    <div class="video">${embed ? `<iframe src="${embed}" allow="autoplay; fullscreen" allowfullscreen></iframe>` : '<div class="none">動画は準備中です</div>'}</div>
    ${steps.length ? `<h2>手順</h2><ol>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
    ${points.length ? `<h2>見るポイント</h2><ul class="pt">${points.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    <div class="nav">
      ${i > 0 ? `<div class="btn" onclick="go('${hashOf([...nodes.slice(0,-1), sibs[i-1]])}')">‹ 前へ</div>` : ''}
      ${i < sibs.length-1 ? `<div class="btn dark" onclick="go('${hashOf([...nodes.slice(0,-1), sibs[i+1]])}')">次へ ›</div>` : ''}
    </div>`;
}

function route(){
  const segs = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const nodes = segs.length ? walk(segs) : null;
  if (nodes) nodeView(nodes); else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
